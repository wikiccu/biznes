name: biznes

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${BIZNES_POSTGRES_DB:-biznes}
      POSTGRES_USER: ${BIZNES_POSTGRES_USER:-biznes}
      POSTGRES_PASSWORD: ${BIZNES_POSTGRES_PASSWORD:?Set BIZNES_POSTGRES_PASSWORD in .env or the process environment}
    ports:
      - "127.0.0.1:${BIZNES_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
